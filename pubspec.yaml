name: busin_workspace
description: Root of the BusIn Dart pub workspace. Holds no code.
publish_to: none

environment:
  sdk: ^3.13.0

# Apps join this list in the phase that creates them (see docs/phases/).
# apps/legacy is intentionally NOT part of the workspace: it keeps its own
# lockfile and Flutter pin until it is retired.
workspace:
  - packages/busin_core
  - packages/busin_data
  - packages/busin_ui
