name: busin_app
description: App plumbing shared by the BusIn Flutter apps (student, ops). Config, Google sign-in with a secure session, appearance choices and the offline helpers. No screens and no data access beyond auth.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  busin_core: any
  busin_ui: any
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.0.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0
  connectivity_plus: ^7.3.2
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
