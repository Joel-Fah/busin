name: busin_student
description: BusIn student app. Subscriptions, rotating QR code, scan history and the live bus. No staff or admin code.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  busin_core: any
  busin_data: any
  busin_ui: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  hugeicons: ^1.1.1
  image_picker: ^1.2.0
  google_sign_in: ^7.0.0
  intl: any
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
