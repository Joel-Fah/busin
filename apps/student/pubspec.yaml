name: busin_student
description: BusIn student app. Subscriptions, rotating QR code, scan history and the live bus. No staff or admin code.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  busin_core: any
  busin_data: any
  busin_ui: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  hugeicons: ^1.1.1
  image_picker: ^1.2.0
  google_sign_in: ^7.0.0
  intl: any
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Stand-in icons rendered from the BusIn wordmark (node tools/render-app-icons.mjs). Replace the PNGs in
# assets/icon with the owner's own artwork and run: fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#002A33"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
