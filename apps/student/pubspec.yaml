name: busin_student
description: BusIn student app. Subscriptions, rotating QR code, scan history and the live bus. No staff or admin code.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  busin_core: any
  busin_data: any
  busin_ui: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  hugeicons: ^1.1.1
  maplibre_gl: ^0.28.0
  image_picker: ^1.2.0
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  google_sign_in: ^7.0.0
  intl: any
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0
  timezone: ^0.10.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    # 3D bus and pin for the map (thiings.co, free licence: attribution required, see docs/decisions/0011).
    - assets/map/
    # Banners of the legal pages: Pexels photos (free licence, no attribution required): pexels.com/photo/5965930, 8771745 and 17121049.
    - assets/legal/

# Stand-in icons rendered from the BusIn wordmark (node tools/render-app-icons.mjs). Replace the PNGs in
# assets/icon with the owner's own artwork and run: fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#002A33"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png

# The native splash: the wordmark at 144 dp in the middle of the brand teal. The app's opening animation (BrandIntro) draws
# the same mark at the same size and place, so the hand-off is invisible. Regenerate with:
#   node tools/render-app-icons.mjs && fvm dart run flutter_native_splash:create
flutter_native_splash:
  color: "#002A33"
  image: assets/splash/wordmark.png
  android_12:
    color: "#002A33"
    image: assets/splash/wordmark.png
