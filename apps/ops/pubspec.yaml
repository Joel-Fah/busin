name: busin_ops
description: BusIn ops app for staff (Android). Starts and ends trips, scans boarding codes (offline too) and shares the bus position.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  busin_app: any
  busin_core: any
  busin_data: any
  busin_ui: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  hugeicons: ^1.1.1
  intl: any
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0
  # Scanning: ML Kit on Android reads the round-dot boarding code. 7.4.2 is the newest release at least two weeks old.
  mobile_scanner: 7.4.2
  # The offline scan queue (ADR 0007). Plain SQL through drift, no code generation.
  drift: 2.35.3
  drift_flutter: ^0.3.1
  # Day keys are secrets: they live in secure storage, not in the queue.
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  # Push notifications (crew_assigned): the same versions as the student app.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  uuid: ^4.5.2
  timezone: ^0.11.0
  # Location: the Android part of geolocator only (the main package clashes with connectivity_plus, see the student app).
  geolocator_android: ^5.2.1
  geolocator_platform_interface: ^4.4.1
  # Scan sounds: short low-latency clips (Android SoundPool). 6.8.1 is the newest release at least two weeks old.
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The scan sounds, made by tool/make_sounds.py.
  assets:
    - assets/sounds/

# Stand-in icons rendered from the BusIn wordmark on the brand orange (node tools/render-app-icons.mjs). Replace the PNGs
# in assets/icon with the owner's own artwork and run: fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F5951F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
